name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rethread
          POSTGRES_PASSWORD: rethread
          POSTGRES_DB: rethread
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rethread"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      TEST_DATABASE_URL: Host=localhost;Port=5432;Username=rethread;Password=rethread;Database=postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore
      - name: Format
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build the image
        run: docker build --tag rethread-api:ci .
